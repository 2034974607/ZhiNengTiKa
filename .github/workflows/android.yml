name: Android APK

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/android.yml'
      - 'android/**'
      - 'Resource/**'
      - 'src/**'
      - 'xinjiaoyu.pro'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a Release after a successful build
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: bricke/Qt-AES
          ref: fe02771df612ca80fdb12b1d48b6e089e1933e6b
          path: third_party/Qt-AES
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: KDAB/android_openssl
          ref: b71f1470962019bd89534a2919f5925f93bc5779
          path: third_party/android_openssl
          persist-credentials: false

      - name: Read application version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^VERSION = //p' xinjiaoyu.pro)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK and Qt-compatible NDK
        shell: bash
        run: |
          sdkmanager 'platform-tools' 'platforms;android-31' 'build-tools;31.0.0' 'ndk;23.1.7779620'
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/23.1.7779620" >> "$GITHUB_ENV"

      - name: Install Qt 6.4.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.4.3'
          host: linux
          target: android
          arch: android_arm64_v8a
          modules: qtwebview qtshadertools
          cache: true

      - name: Configure and compile
        shell: bash
        run: |
          mkdir -p build
          cd build
          qmake ../xinjiaoyu.pro CONFIG+=release ANDROID_ABIS=arm64-v8a ANDROID_PLATFORM=android-31
          make -j2
          make INSTALL_ROOT="$PWD/android-build" install
          shopt -s nullglob
          settings=(android-*-deployment-settings.json)
          test "${#settings[@]}" -eq 1
          androiddeployqt --input "${settings[0]}" --output android-build --android-platform android-31 --jdk "$JAVA_HOME" --gradle --release

      - name: Sign and verify APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing Android signing secrets.' >&2; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          shopt -s nullglob
          unsigned=(build/android-build/build/outputs/apk/release/*-unsigned.apk)
          test "${#unsigned[@]}" -eq 1
          mkdir -p dist
          tools="$ANDROID_HOME/build-tools/31.0.0"
          apk="dist/ZhiNengTiKa-$VERSION-arm64-v8a.apk"
          "$tools/zipalign" -f -p 4 "${unsigned[0]}" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias zhinengtika --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD --out "$apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --verbose --print-certs "$apk"
          "$tools/zipalign" -c -v 4 "$apk"
          "$tools/aapt" dump badging "$apk" | tee "$RUNNER_TEMP/apk-badging.txt"
          grep -F "name='com.LFWQSP2641.xinjiaoyu'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "versionName='$VERSION'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "native-code: 'arm64-v8a'" "$RUNNER_TEMP/apk-badging.txt"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: ZhiNengTiKa-Android-arm64-v8a
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ZhiNengTiKa-Android-arm64-v8a
          path: dist
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --title "ZhiNengTiKa v$VERSION (Android)" --notes-file .github/RELEASE_NOTES.md
